<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mindspace Scenario Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Mindspace Evaluation Viewer</h1>
    <p class="subtitle">Explore PETRI + Debate + Notepad + Referee reasoning for each scenario</p>
</header>

<section id="file-select">
    <h2>Select Artifact File</h2>
    <select id="artifactDropdown">
        <option>Loading...</option>
    </select>
</section>

<section id="scenario-select">
    <h2>Select Scenario</h2>
    <select id="scenarioDropdown">
        <option>Select a file first...</option>
    </select>
</section>

<section id="scenario-viewer">
    <h2>Scenario Details</h2>
    <div id="timeline"></div>
</section>

<script src="app.js"></script>
</body>
</html>
