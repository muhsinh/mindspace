model:
  base_url: "http://localhost:8000/v1"
  id: "qwen"
  temperature: 0.2
  max_tokens: 512
  debate_max_tokens: 512

paths:
  scenarios: "config/scenarios_sycophancy.jsonl"
  transcripts: "artifacts/transcripts_petri"
  reasoning: "artifacts/reasoning_mindspace"

petri:
  max_turns: 4
  max_scenarios: 100
  parallel: 4
  use_mindspace_debate: true

mindspace:
  max_scenarios: 100
  debater_max_tokens: 512
  referee_max_tokens: 512
