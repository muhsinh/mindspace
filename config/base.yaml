model:
  base_url: "http://localhost:8000/v1"   # IMPORTANT: /v1 for vLLM OpenAI server
  id: "Qwen/Qwen2.5-7B-Instruct"                             # MUST match what /v1/models shows
  temperature: 0.2
  max_tokens: 256
  debate_max_tokens: 256

paths:
  scenarios: "config/scenarios_sycophancy.jsonl"
  transcripts: "artifacts/transcripts_petri.jsonl"
  reasoning: "artifacts/reasoning_mindspace.jsonl"

petri:
  max_turns: 4
  max_scenarios: 45          # or 100, whatever you're running
  parallel: 4
  use_mindspace_debate: true

mindspace:
  max_scenarios: 45          # usually match petri.max_scenarios
  debater_max_tokens: 256
  referee_max_tokens: 256
